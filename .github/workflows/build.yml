name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: false
        default: 'latest'

jobs:
  build:
    runs-on: ubuntu-latest
    # softprops/action-gh-release needs write access to create the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build native library + manifest
        # Build the native rcheevos façade on the host (Ubuntu) +
        # emit MANIFEST.json. When the host lacks a C compiler this
        # is a graceful skip and the JAR ships without the native lib.
        run: ./gradlew buildNative writeNativeRaManifest

      - name: Build uberJar
        run: ./gradlew uberJar

      - name: Smoke-test the native path
        # The release JAR must pass its own native smoke before it
        # ships. Exit 3 (no native lib) is OK on the CI host; a real
        # smoke regression (exit 1) fails the build.
        run: java -jar build/libs/nestlin-all.jar nra-smoke
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Nestlin v${{ inputs.version }}
          draft: true
          files: build/libs/nestlin-all.jar
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
