name: documentation

on:
  push:
    branches: [master]
    paths:
      - '**/*.md'
      - '**/*.yml'
      - '**/*.yaml'
      - 'tools/docs_lint.py'
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.yml'
      - '**/*.yaml'
      - 'tools/docs_lint.py'

permissions:
  contents: read

jobs:
  docs:
    name: docs lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate documentation
        run: python tools/docs_lint.py
